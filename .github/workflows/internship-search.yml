name: Monthly ChemE internship search

on:
  schedule:
    # Midnight UTC on the 1st of every month
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to run the search with"
        default: "opus"
        type: string
      commit:
        description: "Commit the results back to the repo"
        default: true
        type: boolean

permissions:
  contents: write

# Shared with the job search so the two never push at the same time.
concurrency:
  group: board-search
  cancel-in-progress: false

jobs:
  search:
    uses: ./.github/workflows/board-search.yml
    secrets: inherit
    with:
      prompt: prompts/internship-search.md
      current: INTERNSHIPS.md
      archive_dir: archive
      label: Internship listings
      model: ${{ inputs.model || 'opus' }}
      # On a schedule run `inputs.commit` is null, and GitHub casts both null and
      # false to 0 — so `inputs.commit != false` would be false and the scheduled
      # run would never commit. Gate on the event instead.
      commit: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
